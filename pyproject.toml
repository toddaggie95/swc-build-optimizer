[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swc-build-optimizer"
version = "0.2.0"
description = "Deterministic SWC city geometry and optimization foundations"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3", "ortools>=9.14,<10"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jsonschema>=4.23,<5", "ruff>=0.11,<1"]

[project.scripts]
swc-build = "swc_build_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
swc_build_optimizer = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
